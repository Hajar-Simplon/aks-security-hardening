<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#345a7c"/></marker></defs><text x="720.0" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#16324f">AKS → Azure: authentication without an access key</text><text x="720.0" y="94" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">The application exchanges a Kubernetes token for an Azure access token.</text><rect x="35" y="140" width="460" height="585" rx="18" fill="#f1f7fe" stroke="#c5d8e9"/><g transform="translate(65,160) scale(0.703125)"><path d="m32 2 25 12 6 27-18 21H19L1 41 7 14Z" fill="#326ce5"/><circle cx="32" cy="32" r="15" fill="none" stroke="white" stroke-width="3"/><path d="M32 10v44M11 25l42 14M17 49l30-34M11 39l42-14M17 15l30 34" stroke="white" stroke-width="2"/></g><text x="240.0" y="191" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#16324f">AKS cluster</text><g transform="translate(215,300) scale(1.5625)"><path d="M32 4 57 18v28L32 60 7 46V18Z" fill="#326ce5"/><path d="m32 14 16 9v18l-16 9-16-9V23Z M16 23l16 9 16-9 M32 32v18" fill="none" stroke="white" stroke-width="3"/></g><text x="265.0" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Application Pod</text><text x="265.0" y="459" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Azure Identity SDK</text><g transform="translate(90,540) scale(1.09375)"><circle cx="26" cy="19" r="12" fill="#0078d4"/><path d="M5 55v-9c0-17 42-17 42 0v9Z" fill="#50b6ed"/><path d="m47 31 14 6v10c0 8-14 14-14 14s-14-6-14-14V37Z" fill="#2355a2"/><path d="m40 45 5 5 9-11" fill="none" stroke="white" stroke-width="3"/></g><text x="305.0" y="561" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">ServiceAccount</text><text x="305.0" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#16324f">prod / app-azure</text><polyline points="230,535 230,483" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)"/><text x="380.0" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#16324f">1  Short-lived token</text><text x="265.0" y="677" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#16324f">AKS signs and projects the token into the Pod.</text><g transform="translate(790,305) scale(1.5625)"><path d="M32 3 61 43 42 58 3 43Z" fill="#0078d4"/><path d="m32 3 10 55-21-18Z" fill="#50e6ff"/><path d="m21 40 21 18L3 43Z" fill="#2255aa"/></g><text x="840.0" y="443" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Microsoft Entra ID</text><text x="840.0" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16324f">Token exchange</text><polyline points="330,330 780,330" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)"/><text x="600.0" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#16324f">2  Send ServiceAccount token</text><polyline points="780,390 330,390" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)"/><text x="600.0" y="415" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#16324f">4  Return Azure access token</text><rect x="650" y="140" width="400" height="135" rx="18" fill="#f6f2fc" stroke="#c5d8e9"/><g transform="translate(670,172) scale(0.9375)"><circle cx="21" cy="23" r="14" fill="none" stroke="#8661c5" stroke-width="7"/><path d="m31 33 24 24m-8-8 8-8m-16 0 8-8" stroke="#8661c5" stroke-width="7"/></g><text x="885.0" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#16324f">3  Verify federation trust</text><text x="885.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#16324f">Signature + issuer + subject + audience</text><polyline points="840,305 840,276" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><g transform="translate(1140,180) scale(1.171875)"><circle cx="26" cy="19" r="12" fill="#0078d4"/><path d="M5 55v-9c0-17 42-17 42 0v9Z" fill="#50b6ed"/><path d="m47 31 14 6v10c0 8-14 14-14 14s-14-6-14-14V37Z" fill="#2355a2"/><path d="m40 45 5 5 9-11" fill="none" stroke="white" stroke-width="3"/></g><text x="1180.0" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324f">Azure managed identity</text><text x="1180.0" y="311" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#16324f">Federated credential configured</text><polyline points="1125,216 1055,216" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><g transform="translate(1125,530) scale(1.71875)"><path d="M15 49C-3 48 0 25 15 25 17 3 47 3 50 24 68 22 70 49 51 49Z" fill="#0078d4"/><rect x="24" y="28" width="19" height="25" rx="3" fill="white"/><path d="M28 34h11m-11 6h11m-11 6h11" stroke="#0078d4" stroke-width="2"/></g><text x="1180.0" y="672" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#16324f">Azure resource API</text><polyline points="330,460 550,460 550,594 1110,594" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)"/><text x="840.0" y="569" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#16324f">5  Call Azure with the access token</text><g transform="translate(1129,731) scale(1.015625)"><path d="m32 3 25 10v19c0 19-25 30-25 30S7 51 7 32V13Z" fill="#159570"/><path d="m19 31 9 10 18-22" fill="none" stroke="white" stroke-width="5"/></g><text x="1010.0" y="754" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16324f">6  Check Azure RBAC</text><text x="1010.0" y="783" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#16324f">Allow only granted operations</text><polyline points="1190,313 1330,313 1330,757 1210,757" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="1292.5" y="457" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#16324f">Assigned roles</text><polyline points="1163,730 1163,700" fill="none" stroke="#345a7c" stroke-width="2.5" marker-end="url(#a)" stroke-dasharray="7 5"/><text x="720.0" y="843" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#16324f">Authentication = who the workload is     •     Authorization = what it may do</text><text x="720.0" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#16324f">Illustrative ServiceAccount and application identity. Cluster prerequisites: OIDC and Workload Identity enabled.</text></svg>