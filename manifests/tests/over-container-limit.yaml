apiVersion: v1
kind: Pod
metadata:
  name: over-container-limit
  namespace: prod
spec:
  restartPolicy: Never
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "2"
          memory: 128Mi
